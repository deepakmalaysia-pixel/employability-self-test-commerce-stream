<style>
/* Layout: one-column answer-sheet app. Boldness sits in one place: OMR-style answer bubbles (A B C D) like bank and entrance exam sheets. */
:root{
  --bg:#F4F7FB;
  --surface:#FFFFFF;
  --fg:#101B33;
  --muted:#4A5977;
  --line:#CFD8E8;
  --accent:#2441C9;
  --accent-soft:#E6EBFD;
  --on:#FFFFFF;
  --good:#11694A;
  --good-soft:#E1F4EC;
  --bad:#B02A2A;
  --bad-soft:#FBE7E7;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1426;--surface:#162039;--fg:#E8EDF8;--muted:#9FADCB;--line:#2B3858;
    --accent:#8EA2FF;--accent-soft:#212C52;--on:#0D1426;
    --good:#4FD3A0;--good-soft:#12352B;--bad:#FF8A8A;--bad-soft:#3C1D24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1426;--surface:#162039;--fg:#E8EDF8;--muted:#9FADCB;--line:#2B3858;
  --accent:#8EA2FF;--accent-soft:#212C52;--on:#0D1426;
  --good:#4FD3A0;--good-soft:#12352B;--bad:#FF8A8A;--bad-soft:#3C1D24;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg);color:var(--fg);
  font:17px/1.5 var(--font-body);
  padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:660px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 8px}
h1{font-family:var(--font-display);font-weight:800;font-size:2.1rem;line-height:1.08;margin:0 0 10px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 22px;max-width:54ch}
.sec{font-family:var(--font-display);font-size:1.15rem;font-weight:700;margin:28px 0 12px}

.mock{
  width:100%;text-align:left;cursor:pointer;border:0;border-radius:14px;
  background:var(--accent);color:var(--on);padding:18px;
  display:flex;flex-direction:column;gap:4px;
}
.mock .t{font-family:var(--font-display);font-weight:800;font-size:1.35rem}
.mock .b{opacity:.95}
.mock .meta{font-size:.9rem;font-weight:700;margin-top:6px}

.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{
  text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0;
}
.card:hover{border-color:var(--accent)}
.card .no{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--accent)}
.card .t{font-family:var(--font-display);font-weight:700;font-size:1.1rem;line-height:1.25}
.card .b{color:var(--muted);font-size:.95rem}
.card .meta{margin-top:auto;padding-top:8px;font-size:.88rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}

.foot{margin-top:32px;font-size:.85rem;color:var(--muted);max-width:60ch}

.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.link{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;min-height:44px;padding:0}
.count{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.kicker{margin:20px 0 6px;font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.q{font-family:var(--font-display);font-weight:600;font-size:1.35rem;line-height:1.3;margin:0 0 18px}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{
  width:100%;display:grid;grid-template-columns:auto 1fr;align-items:center;gap:14px;text-align:left;
  min-height:58px;padding:12px 14px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:12px;cursor:pointer;
}
.opt:hover:not(:disabled){border-color:var(--accent)}
.bub{
  width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);color:var(--muted);
  display:grid;place-items:center;font-weight:700;font-size:.9rem;
}
.txt{min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--on)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bub{background:var(--good);border-color:var(--good);color:var(--on)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--on)}
.opt:disabled{cursor:default;color:var(--fg)}
.opt:disabled:not(.right):not(.wrong){opacity:.7}

.fb{margin-top:16px;padding:14px 16px;border-radius:12px;font-size:.98rem}
.fb.good{background:var(--good-soft);border:1px solid var(--good)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.nav{margin-top:18px}
.primary,.secondary{
  width:100%;min-height:52px;border-radius:12px;font-weight:700;cursor:pointer;padding:0 18px;
}
.primary{background:var(--accent);color:var(--on);border:0}
.primary:disabled{background:var(--line);color:var(--muted);cursor:not-allowed}
.secondary{background:var(--surface);border:1.5px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.actions>button{flex:1 1 160px}

.score{display:flex;align-items:baseline;gap:10px;margin:8px 0 4px}
.score b{font-family:var(--font-display);font-weight:800;font-size:4rem;line-height:1;font-variant-numeric:tabular-nums}
.score span{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.verdict{font-family:var(--font-display);font-weight:700;font-size:1.3rem;margin:12px 0 4px}
.by{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.by li{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-variant-numeric:tabular-nums}
.by li span:first-child{min-width:0}
.revs{display:flex;flex-direction:column;gap:12px}
.rev{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rev p{margin:0 0 8px}
.rev .rq{font-weight:700}
.rev .mod{font-size:.8rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.rev .you{color:var(--bad)}
.rev .ans{color:var(--good)}
.rev .why{color:var(--muted);margin-bottom:0}

@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
@media (max-width:420px){h1{font-size:1.8rem}.q{font-size:1.25rem}}
</style>

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function load() {

    var b = d[id];

      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {}
    }
  }

        '<span class="t">' + esc(m.title) + '</span>' +
        '<span class="b">' + esc(m.blurb) + '</span>' +
        '<span class="meta">' + m.qs.length + ' questions' + (b ? " · Best " + b.s + "/" + b.n : "") + '</span>' +
        '</button>';
    }).join("");
    app.innerHTML =
      '<header>' +
      '<p class="eyebrow">Aasha Infinite Foundation</p>' +
      '<h1>Employability Self-Test</h1>' +
      '<p class="lead">Check what you have learnt from the Employability Readiness Program. Pick a module, answer the questions, and see your score. Your scores stay on your phone.</p>' +
      '</header>' +
      '<button class="mock" data-action="start" data-id="mock">' +
      '<span class="t">Full Mock Test</span>' +
      '<span class="b">24 questions from all six modules. Answers are shown at the end, like a real test.</span>' +
      '<span class="meta">Start the test' + mockBest + '</span>' +
      '</button>' +
      '<h2 class="sec">Practice one module at a time</h2>' +
      '<div class="grid">' + cards + '</div>' +
      '<p class="foot">In a module test, you see the right answer and a short explanation after every question. In the full mock test, you see them only at the end.</p>';
    window.scrollTo(0, 0);
  }

  function start(id) {
    var items;
    if (id === "mock") {
      var pool = [];
      MODULES.forEach(function (m) {
        shuffle(m.qs).slice(0, 4).forEach(function (q) {
          pool.push({ q: q.q, o: q.o, e: q.e, m: m.title });
        });
      });
      items = build(shuffle(pool));
      S = { id: id, mode: "mock", title: "Full Mock Test" };
    } else {
      var mod = MODULES.filter(function (x) { return x.id === id; })[0];
      items = build(mod.qs.map(function (q) { return { q: q.q, o: q.o, e: q.e, m: mod.title }; }));
      S = { id: id, mode: "practice", title: "Module " + mod.no + " test" };
    }
    S.items = items; S.i = 0; S.picks = [];
    quiz();
    window.scrollTo(0, 0);
  }

  function quiz() {
    var it = S.items[S.i], n = S.items.length, L = "ABCD";
    var picked = S.picks[S.i];
    var has = picked !== undefined;
    var practice = S.mode === "practice";
    var opts = it.opts.map(function (o, k) {
      var cls = "opt", mark = L[k];
      if (practice && has) {
        if (o.ok) { cls += " right"; mark = "✓"; }
        else if (k === picked) { cls += " wrong"; mark = "✗"; }
      } else if (picked === k) { cls += " sel"; }
      return '<button class="' + cls + '" data-action="pick" data-k="' + k + '"' +
        (practice && has ? " disabled" : "") + ' aria-pressed="' + (picked === k) + '">' +
        '<span class="bub">' + mark + '</span><span class="txt">' + esc(o.t) + '</span></button>';
    }).join("");
    var fb = "";
    if (practice && has) {
      var ok = it.opts[picked].ok;
      var right = it.opts.filter(function (o) { return o.ok; })[0].t;
      fb = '<div class="fb ' + (ok ? "good" : "bad") + '" role="status"><strong>' +
        (ok ? "Correct." : "Not quite.") + '</strong> ' +
        (ok ? "" : "The right answer is <b>" + esc(right) + "</b>. ") + esc(it.e) + '</div>';
    }
    app.innerHTML =
      '<div class="top"><button class="link" data-action="home">← All tests</button>' +
      '<span class="count">Question ' + (S.i + 1) + ' of ' + n + '</span></div>' +
      '<div class="bar" aria-hidden="true"><i style="width:' + Math.round((S.i + (has ? 1 : 0)) / n * 100) + '%"></i></div>' +
      '<p class="kicker">' + esc(practice ? S.title : it.m) + '</p>' +
      '<h2 class="q">' + esc(it.q) + '</h2>' +
      '<div class="opts">' + opts + '</div>' + fb +
      '<div class="nav"><button class="primary" data-action="next"' + (has ? "" : " disabled") + '>' +
      (S.i === n - 1 ? "See my score" : "Next question") + '</button></div>';
  }

  function result() {
    var n = S.items.length, sc = 0, wrong = [], by = {};
    S.items.forEach(function (it, i) {
      var ok = it.opts[S.picks[i]].ok;
      by[it.m] = by[it.m] || { s: 0, n: 0 };
      by[it.m].n++;
      if (ok) { sc++; by[it.m].s++; } else { wrong.push(i); }
    });
    save(S.id, sc, n);
    var pct = sc / n, v;
    if (pct >= 0.8) v = ["Strong result.", "You know this well. Try another module or the full mock test."];
    else if (pct >= 0.5) v = ["Good start.", "Read the explanations below, then try again to improve your score."];
    else v = ["Keep practising.", "Read the explanations below, go back to the lesson, and try again. Every try helps."];

    var breakdown = "";
    if (S.mode === "mock") {
      breakdown = '<h2 class="sec">Score by module</h2><ul class="by">' +
        Object.keys(by).map(function (k) {
          return '<li><span>' + esc(k) + '</span><span><b>' + by[k].s + '/' + by[k].n + '</b></span></li>';
        }).join("") + '</ul>';
    }
    var review;
    if (!wrong.length) {
      review = '<p>You got every question right.</p>';
    } else {
      review = '<div class="revs">' + wrong.map(function (i) {
        var it = S.items[i];
        var right = it.opts.filter(function (o) { return o.ok; })[0].t;
        return '<article class="rev">' +
          (S.mode === "mock" ? '<p class="mod">' + esc(it.m) + '</p>' : '') +
          '<p class="rq">Q' + (i + 1) + '. ' + esc(it.q) + '</p>' +
          '<p class="you">Your answer: ' + esc(it.opts[S.picks[i]].t) + '</p>' +
          '<p class="ans">Right answer: ' + esc(right) + '</p>' +
          '<p class="why">' + esc(it.e) + '</p></article>';
      }).join("") + '</div>';
    }
    app.innerHTML =
      '<div class="top"><button class="link" data-action="home">← All tests</button></div>' +
      '<p class="kicker">' + esc(S.title) + ' result</p>' +
      '<div class="score"><b>' + sc + '</b><span>out of ' + n + ' · ' + Math.round(pct * 100) + '%</span></div>' +
      '<p class="verdict">' + v[0] + '</p><p>' + v[1] + '</p>' +
      '<div class="actions"><button class="primary" data-action="retry">Try again</button>' +
      '<button class="secondary" data-action="home">All tests</button></div>' +
      breakdown +
      '<h2 class="sec">' + (wrong.length ? "Questions to review" : "Review") + '</h2>' + review;
    window.scrollTo(0, 0);
  }

  app.addEventListener("click", function (e) {
    var b = e.target.closest("[data-action]");
    if (!b || b.disabled) return;
    var a = b.dataset.action;
    if (a === "start") start(b.dataset.id);
    else if (a === "home") home();
    else if (a === "retry") start(S.id);
    else if (a === "pick") {
      S.picks[S.i] = +b.dataset.k;
      quiz();
      if (S.mode === "practice") {
        var nx = app.querySelector('[data-action="next"]');
        if (nx) { nx.focus({ preventScroll: true }); nx.scrollIntoView({ block: "nearest", behavior: reduce ? "auto" : "smooth" }); }
      } else {
        var sel = app.querySelector(".opt.sel");
        if (sel) sel.focus({ preventScroll: true });
      }
    } else if (a === "next") {
      if (S.i < S.items.length - 1) { S.i++; quiz(); window.scrollTo(0, 0); }
      else result();
    }
  });

  home();
})();
</script>

</body></html>
